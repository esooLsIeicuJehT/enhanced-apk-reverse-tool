name: CI

on:
  push:
    branches: [main, production-hardening-2026-10-06]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend, scanners, and shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q api-server apk-tool-features

      - name: Check shell syntax
        run: |
          bash -n apk-reverse-tool.sh
          bash -n integrate.sh
          bash -n install-dependencies.sh
          bash -n demo.sh

      - name: Run tests
        run: pytest -q api-server/tests apk-tool-features/tests

  frontend:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-interface
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

  containers:
    name: Container smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      SECRET_KEY: ci-secret-key-ci-secret-key-ci-secret-key
      JWT_SECRET_KEY: ci-jwt-secret-key-ci-jwt-secret-key-ci
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build containers
        run: docker compose build

      - name: Boot stack and check health
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker compose logs --no-color || true
            docker compose down -v --remove-orphans || true
          }
          trap cleanup EXIT

          docker compose up -d

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "Services did not become healthy in time" >&2
          exit 1
