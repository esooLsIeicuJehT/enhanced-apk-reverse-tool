services:
  apk-tool:
    build:
      context: .
      dockerfile: Dockerfile.main-tool
    restart: unless-stopped
    environment:
      APP_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 8080
      DATA_DIR: /data
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in your environment or .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in your environment or .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-536870912}
      MAX_ANALYSIS_TIME: ${MAX_ANALYSIS_TIME:-3600}
      MAX_QUEUE_SIZE: ${MAX_QUEUE_SIZE:-16}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - apk-data:/data
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - apk-tool-network

  web-interface:
    build:
      context: ./web-interface
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      apk-tool:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - apk-tool-network

networks:
  apk-tool-network:
    driver: bridge

volumes:
  apk-data:
